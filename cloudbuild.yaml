steps:
  # Install dependencies
  # Uses custom image with Chrome deps pre-installed (see Dockerfile.cloudbuild).
  # Pinned to an immutable dated tag (cloudbuild-image.yaml builds it); bump
  # the date here only after the new image has been pushed.
  - name: 'gcr.io/personal-website-334502/node-puppeteer:22-2026-10-31'
    entrypoint: npm
    args: ['ci']
    id: 'install-dependencies'

  # Restore the previous build's data cache as a last-known-good fallback.
  # The build still fetches fresh data for every source — this is only read
  # (via FileCache.getStale) when a scrape/API fails outright, so the page
  # renders yesterday's data instead of nothing. The health check still
  # alerts on the stale timestamp.
  # rsync refuses a destination directory that doesn't exist yet — without
  # the mkdir this step failed on every build and the fallback never worked.
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: bash
    args:
      - '-c'
      - 'mkdir -p .cache-fallback && gsutil -m rsync -r gs://personal-website-334502_cloudbuild/build-cache .cache-fallback || echo "WARNING: could not restore previous build cache"'
    id: 'restore-build-cache'
    waitFor: ['-']

  # Build the site with environment variables from Secret Manager
  - name: 'gcr.io/personal-website-334502/node-puppeteer:22-2026-10-31'
    entrypoint: bash
    args:
      - '-c'
      - |
        # Pre-build: load every credential from the SITE_SECRETS secret, refresh
        # OAuth tokens/sessions, and save renewed ones back in ONE write (see
        # scripts/site-secrets.cjs). Done before Astro builds pages in parallel
        # so pages never race to refresh the same token.
        node scripts/refresh-tokens.cjs

        # Every credential, renewed ones included (written by refresh-tokens.cjs)
        if [ -f .env.refresh ]; then
          echo "Loading credentials..."
          set -a
          source .env.refresh
          set +a
          rm -f .env.refresh
        fi

        # npm run build (not npx astro build) so any pre/postbuild hooks run.
        # It has no prebuild: the secret pull + token refresh live in
        # `npm run build:fresh` for local use, so the refresh above is the
        # only one.
        npm run build
    id: 'build-site'
    env:
      - 'NODE_ENV=production'
      - 'CLOUD_BUILD=true'
    waitFor: ['install-dependencies', 'restore-build-cache']

  # Save this build's data cache for the next build's fallback. No -d flag:
  # if a source failed today (no cache file written), the previous good copy
  # stays in the bucket instead of being deleted.
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: bash
    args:
      - '-c'
      - 'gsutil -m rsync -r .cache gs://personal-website-334502_cloudbuild/build-cache || echo "No cache to save"'
    id: 'save-build-cache'
    # check-api-health writes .cache/api-health-report.json; don't upload a
    # half-written copy
    waitFor: ['build-site', 'check-api-health']

  # Append this build's data to the historical snapshot archive (read by
  # future stats pages; the build-cache above stays the fallback mechanism).
  # Every build writes its own timestamped directory
  # (snapshots/YYYY-MM-DD/HHMMSS/, UTC — this container has no tzdata, and
  # readers regroup timestamps into local days at read time anyway) — pure
  # append-only, nothing is ever overwritten, so intra-day builds each
  # preserve their fetch (e.g. distinct Spotify recently-played windows).
  # Non-fatal: snapshot problems must never fail the build.
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: bash
    args:
      - '-c'
      - |
        STAMP=$$(date -u "+%F/%H%M%S")
        mkdir -p /tmp/snap
        for f in .cache/*.json; do
          [ -e "$$f" ] || continue
          gzip -c "$$f" > "/tmp/snap/$$(basename $$f).gz"
        done
        gsutil -m cp /tmp/snap/*.gz "gs://personal-website-334502_cloudbuild/snapshots/$$STAMP/" \
          || echo "WARNING: snapshot upload failed"
    id: 'save-daily-snapshot'
    waitFor: ['build-site', 'check-api-health']

  # Check API health and send notifications if any failed
  - name: 'gcr.io/personal-website-334502/node-puppeteer:22-2026-10-31'
    entrypoint: node
    args: ['scripts/check-api-health.cjs']
    id: 'check-api-health'
    env:
      - 'NODE_ENV=production'
      - 'CLOUD_BUILD=true'  # reads Discord credentials from SITE_SECRETS
    waitFor: ['build-site']

  # Unit tests + type-check, in parallel with the build; a failure blocks the
  # deploy below. Runs on a copy of just the sources: the concurrent build
  # writes .cache/, dist/ and a credentials file in the workspace, and
  # `astro sync` writes .astro/ and node_modules/.astro/, which the build is
  # using. The copy's node_modules is a directory of symlinks into the real
  # one, so the copy's .astro/.vite caches stay private.
  - name: 'gcr.io/personal-website-334502/node-puppeteer:22-2026-10-31'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        CI_DIR=/tmp/ci-check
        mkdir -p $$CI_DIR/node_modules
        cp -R src scripts astro.config.mjs package.json tsconfig.json vitest.config.ts $$CI_DIR/
        for entry in node_modules/* node_modules/.bin; do
          ln -s "$$PWD/$$entry" "$$CI_DIR/$$entry"
        done
        cd $$CI_DIR
        npx vitest run
        npm run typecheck
    id: 'test'
    env:
      - 'CI=true'
    waitFor: ['install-dependencies']

  # Deploy to Firebase Hosting (security/cache headers and CDN invalidation
  # are handled by firebase.json + the deploy itself). Gated on the tests.
  - name: 'gcr.io/personal-website-334502/node-puppeteer:22-2026-10-31'
    entrypoint: npx
    args: ['firebase-tools', 'deploy', '--only', 'hosting', '--project', 'personal-website-334502', '--non-interactive']
    id: 'deploy-to-firebase'
    waitFor: ['build-site', 'test']

# No availableSecrets: every credential lives in the single SITE_SECRETS
# secret, read with the Secret Manager SDK by refresh-tokens.cjs and
# check-api-health.cjs (the build service account has secretAccessor and
# secretVersionManager on the project).

# Build configuration
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # Use a more powerful machine for faster builds

timeout: 1800s  # 30 minutes for build (generous time for API calls)
