# Build the custom Cloud Build image with Chrome dependencies pre-installed.
# Run: gcloud builds submit --config=cloudbuild-image.yaml .
# Rebuild when: a Node security release ships, Chrome deps change, or
# Puppeteer upgrades.
#
# Two tags: :22 moves to the newest build; :22-YYYY-MM-DD never changes and
# is what cloudbuild.yaml pins, so a rebuilt image can't silently change the
# site build. To roll forward: bump _DATE here, build + push, then update the
# image tag in cloudbuild.yaml in the same PR (push the image BEFORE merging).
substitutions:
  _IMAGE: 'gcr.io/personal-website-334502/node-puppeteer'
  _DATE: '2026-10-31'
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--pull'
      - '-t'
      - '${_IMAGE}:22'
      - '-t'
      - '${_IMAGE}:22-${_DATE}'
      - '-f'
      - 'Dockerfile.cloudbuild'
      - '.'
images:
  - '${_IMAGE}:22'
  - '${_IMAGE}:22-${_DATE}'
